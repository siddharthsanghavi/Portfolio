<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sid's Thought Terminal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #faf9f7;
    --fg: #1a1a1a;
    --mut: #8a857e;
    --mut2: #4a4a4a;
    --border: #e6e2dc;
    --accent-orange: #e2692a;
    --accent-blue: #2b5fd9;
  }

  html.dark {
    --bg: #0e1116;
    --fg: #f4f6f9;
    --mut: #6b7480;
    --mut2: #9aa3ad;
    --border: #1e2530;
    --accent-orange: #f0894a;
    --accent-blue: #5b8cff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    background-color: var(--bg);
    color: var(--fg);
    transition: background-color .2s ease, color .2s ease;
  }

  a { text-decoration: none; }
  ::selection { background: #2b5fd9; color: #fff; }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 72px;
  }

  /* header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 34px 0 30px;
  }

  .header .name {
    font-weight: 700;
    font-size: 19px;
  }

  .header nav {
    display: flex;
    align-items: center;
    gap: 26px;
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--mut);
  }

  .header nav a {
    color: var(--accent-blue);
  }

  #dark-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: .06em;
    background: none;
    border: 1px solid var(--accent-orange);
    color: var(--fg);
    padding: 7px 14px;
    cursor: pointer;
  }

  /* intro */
  .intro {
    padding: 56px 0 40px;
  }

  .intro .eyebrow {
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--mut);
    margin-bottom: 34px;
  }

  .intro h1 {
    font-weight: 500;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -.03em;
    margin: 0 0 28px;
  }

  .intro p {
    font-size: 18px;
    line-height: 1.6;
    color: var(--mut2);
    max-width: 56ch;
    margin: 0;
  }

  /* notes list */
  .note {
    padding: 34px 0;
    border-top: 1px solid var(--border);
  }

  .note-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .note-head h2 {
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }

  .note-head .date {
    font-size: 12px;
    color: var(--accent-blue);
  }

  .note .body {
    font-size: 15px;
    line-height: 1.7;
    color: var(--mut2);
    margin: 0;
    max-width: 64ch;
  }

  .note .body > :first-child { margin-top: 0; }
  .note .body > :last-child { margin-bottom: 0; }

  .note .body a { color: var(--accent-blue); }

  .note .body img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 20px 0;
    border: 1px solid var(--border);
  }

  .note .body pre {
    background: var(--border);
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
  }

  .note .body code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .note .body blockquote {
    margin: 16px 0;
    padding-left: 16px;
    border-left: 2px solid var(--accent-orange);
    color: var(--mut);
  }

  .note .body h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    color: var(--fg);
    margin: 24px 0 10px;
  }

  .empty {
    padding: 34px 0;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--mut);
  }

  /* footer */
  footer {
    padding: 60px 0 90px;
    border-top: 1px solid var(--border);
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  footer a {
    font-size: 13px;
    color: var(--accent-blue);
  }

  footer .name {
    font-size: 12px;
    color: var(--mut);
  }
</style>
</head>
<body>
<div class="container">

  <!-- header -->
  <div class="header">
    <span class="name">Siddharth Sanghavi</span>
    <nav class="mono">
      <a href="index.html">Portfolio</a>
      <button id="dark-toggle" class="mono">DARK MODE</button>
    </nav>
  </div>

  <!-- intro -->
  <div class="intro">
    <div class="eyebrow mono">NOTES</div>
    <h1>Sid's Thought Terminal</h1>
    <p>Short write-ups and things I've been thinking about — mostly engineering, tools, and school.</p>
  </div>

  <!-- notes -->
  <div id="notes">
    <p class="empty mono">Loading…</p>
  </div>

  <!-- footer nav -->
  <footer>
    <a class="mono" href="index.html">← Back to Portfolio</a>
    <span class="name mono">Siddharth Sanghavi</span>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
  var darkToggle = document.getElementById('dark-toggle');
  darkToggle.addEventListener('click', function () {
    var isDark = document.documentElement.classList.toggle('dark');
    darkToggle.textContent = isDark ? 'LIGHT MODE' : 'DARK MODE';
  });

  function formatDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  }

  function renderNotes(notes) {
    var container = document.getElementById('notes');

    if (!notes.length) {
      container.innerHTML = '<p class="empty mono">Nothing posted yet.</p>';
      return;
    }

    container.innerHTML = '';

    notes.forEach(function (note) {
      var el = document.createElement('div');
      el.className = 'note';

      var head = document.createElement('div');
      head.className = 'note-head';

      var h2 = document.createElement('h2');
      h2.textContent = note.title;

      var date = document.createElement('span');
      date.className = 'date mono';
      date.textContent = formatDate(note.created_at);

      head.appendChild(h2);
      head.appendChild(date);

      var body = document.createElement('div');
      body.className = 'body mono';
      body.innerHTML = DOMPurify.sanitize(marked.parse(note.body));

      el.appendChild(head);
      el.appendChild(body);
      container.appendChild(el);
    });
  }

  fetch('/api/notes')
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(renderNotes)
    .catch(function () {
      document.getElementById('notes').innerHTML =
        '<p class="empty mono">Could not load notes.</p>';
    });
</script>
</body>
</html>
